[project]
name = "error-handling"
version = "0.1.0"
description = "Testing error handling, recovery, logging, and monitoring in ML pipelines"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pandas>=2.2", "prometheus-client>=0.20", "retry>=0.9.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
