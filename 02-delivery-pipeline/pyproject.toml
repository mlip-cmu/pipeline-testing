[project]
name = "delivery-pipeline"
version = "0.1.0"
description = "From notebook code to a modular, tested ML pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]
notebook = ["jupyterlab>=4", "papermill>=2.6", "ipykernel>=6"]
orchestration = ["dvc>=3.50"]
tracking = ["mlflow>=2.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
