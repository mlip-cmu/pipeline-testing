[project]
name = "wrangling-bugs"
version = "0.1.0"
description = "Subtle bugs in data wrangling code and tests that find them"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::pandas.errors.ChainedAssignmentError"]
