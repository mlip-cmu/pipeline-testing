[project]
name = "wrangling-bugs"
version = "0.1.0"
description = "Subtle bugs in data wrangling code: a notebook, and tests that find (or miss) them"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6"]
notebook = ["jupyterlab>=4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["functions-and-tests"]
testpaths = ["tests", "functions-and-tests/tests"]
filterwarnings = ["ignore::pandas.errors.ChainedAssignmentError"]
