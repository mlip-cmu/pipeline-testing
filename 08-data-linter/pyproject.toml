[project]
name = "data-linter"
version = "0.1.0"
description = "Lightweight sanity checks for ML datasets, after Google's Data Linter"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
