[project]
name = "component-integration"
version = "0.1.0"
description = "Integration test for an ensemble of model services with timeouts"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
