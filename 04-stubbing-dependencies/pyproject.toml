[project]
name = "stubbing-dependencies"
version = "0.1.0"
description = "Decoupling data cleaning code from an external API to test it with stubs and mocks"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
